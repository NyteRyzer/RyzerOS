name: screenshots

# Runs Ryzer OS in an Android emulator with a sample library and commits fresh screenshots
# to docs/screenshots/raw. Run it from the Actions tab, or push a change under tools/screenshots.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/screenshots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

# One run at a time: a newer push replaces a run that hasn't finished yet
concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Sample library
        run: python tools/screenshots/make_demo.py demo
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 960x1440
          script: python tools/screenshots/capture.py android/app/build/outputs/apk/release/app-release.apk demo docs/screenshots/raw
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/raw
      - name: Record the tested app code
        run: echo "android=$(git rev-parse HEAD:android) ryzer=$(git rev-parse HEAD:ryzer)" > docs/screenshots/raw/tested.txt
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/raw
          git commit -m "Update app screenshots [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Release gate (speed, stability, tested code)
        run: python3 tools/release_gate.py
