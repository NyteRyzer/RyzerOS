name: build

on:
  push:
    # Docs, website and screenshot changes don't need a new build
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
      - "tools/screenshots/**"
      - "tools/release_notes.py"
      - "tools/build_site.py"
      - ".github/workflows/screenshots.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release-notes.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux edition (tests + zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame-ce==2.5.8 pytest
      - run: python -m pytest -q
      - run: sh -n system/ryzer-perf && sh -n system/ryzer-tune && sh -n install/install.sh && sh -n install/uninstall.sh
      - run: ./build/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RyzerOS-linux
          path: dist/RyzerOS-*.zip

  android:
    name: Android edition (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          VERSION=$(grep '^VERSION' ryzer/__init__.py | cut -d'"' -f2)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/RyzerOS-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RyzerOS-android
          path: dist/RyzerOS-*.apk

  release:
    name: Publish download
    needs: [linux, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^VERSION' ryzer/__init__.py | cut -d'"' -f2)
          TAG="v$VERSION"
          # Fixed file names so this link always gets the newest APK:
          #   https://github.com/<owner>/<repo>/releases/latest/download/RyzerOS.apk
          mkdir -p out
          cp dist/RyzerOS-*.apk out/RyzerOS.apk
          cp dist/RyzerOS-*.zip out/RyzerOS-Linux.zip
          # Old-style pre-releases from earlier builds
          for old in $(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep '^latest-' || true); do
            gh release delete "$old" --yes --cleanup-tag || true
          done
          # Rebuilds of the same version replace that version's release
          gh release delete "$TAG" --yes --cleanup-tag || true
          python3 tools/release_notes.py "$VERSION" --latest > notes.md
          gh release create "$TAG" out/RyzerOS.apk out/RyzerOS-Linux.zip --latest --target "$GITHUB_SHA" \
            --title "$(python3 tools/release_notes.py "$VERSION" --title)" --notes-file notes.md
