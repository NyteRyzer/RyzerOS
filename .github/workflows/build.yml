name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux edition (tests + zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame-ce==2.5.8 pytest
      - run: python -m pytest -q
      - run: sh -n system/ryzer-perf && sh -n system/ryzer-tune && sh -n install/install.sh && sh -n install/uninstall.sh
      - run: ./build/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RyzerOS-linux
          path: dist/RyzerOS-*.zip

  android:
    name: Android edition (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          VERSION=$(grep '^VERSION' ryzer/__init__.py | cut -d'"' -f2)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/RyzerOS-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RyzerOS-android
          path: dist/RyzerOS-*.apk

  release:
    name: Publish download
    needs: [linux, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Ryzer OS (latest build from $GITHUB_REF_NAME)" \
            --notes "Android: download the .apk on your handheld and open it to install. Linux (ROCKNIX, Knulli, muOS, ArkOS): download the .zip and run install.sh. Built from ${GITHUB_SHA::7}."
