name: release notes

# Rewrites the title and notes of every release from CHANGELOG.md, without rebuilding.
on:
  workflow_dispatch:
  push:
    paths:
      - "CHANGELOG.md"
      - "tools/release_notes.py"
      - ".github/workflows/release-notes.yml"

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --json tagName --jq .tagName)
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            flag=""
            [ "$tag" = "$LATEST" ] && flag="--latest"
            python3 tools/release_notes.py "$v" $flag > notes.md
            gh release edit "$tag" --title "$(python3 tools/release_notes.py "$v" --title)" --notes-file notes.md
          done
